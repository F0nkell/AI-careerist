server {
    listen 80;
    server_name fonkrit.ru www.fonkrit.ru;

    # 1. Фронтенд (React)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. Бэкенд (API)
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name fonkrit.ru www.fonkrit.ru;

    ssl_certificate /etc/letsencrypt/live/fonkrit.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fonkrit.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 1. Фронтенд (React)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 2. Бэкенд (API)
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}