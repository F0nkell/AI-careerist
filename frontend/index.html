<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F0nKrit - Resume Review & Interview Prep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Bidvol SSP Ad Tag -->
<div id="bidvol-ad-c11eadfe-2f99-4f63-adbb-2375542c70e5" data-bidvol-zone="c11eadfe-2f99-4f63-adbb-2375542c70e5"></div>
<script>
(function() {
  var zoneId = "c11eadfe-2f99-4f63-adbb-2375542c70e5";
  var baseUrl = "https://s.bidvol.com";
  var containerId = "bidvol-ad-" + zoneId;
  var clientStorageKey = "bdvl_cid";
  var debug = window.BIDVOL_DEBUG === true || window.location.search.indexOf("bidvol_debug=1") !== -1;

  function log() {
    if (!debug || !window.console) {
      return;
    }
    console.log.apply(console, ["[Bidvol]"].concat(Array.prototype.slice.call(arguments)));
  }

  function createId() {
    if (window.crypto && window.crypto.randomUUID) {
      return window.crypto.randomUUID();
    }
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  function getClientId() {
    try {
      var stored = window.localStorage.getItem(clientStorageKey);
      if (stored) {
        return stored;
      }
      var nextId = createId();
      window.localStorage.setItem(clientStorageKey, nextId);
      return nextId;
    } catch (error) {
      return createId();
    }
  }

  function buildContext(clientId) {
    var timezone = "";
    try {
      timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    } catch (error) {}

    return {
      client_id: clientId,
      page_url: window.location.href,
      referrer: document.referrer || "",
      screen_width: window.screen ? window.screen.width : null,
      screen_height: window.screen ? window.screen.height : null,
      viewport_width: window.innerWidth || document.documentElement.clientWidth || null,
      viewport_height: window.innerHeight || document.documentElement.clientHeight || null,
      language: navigator.language || "",
      timezone: timezone,
      user_agent: navigator.userAgent || ""
    };
  }

  function renderAd(container, html) {
    container.innerHTML = html;

    Array.prototype.slice.call(container.querySelectorAll("script")).forEach(function(oldScript) {
      var nextScript = document.createElement("script");
      Array.prototype.slice.call(oldScript.attributes).forEach(function(attr) {
        nextScript.setAttribute(attr.name, attr.value);
      });
      nextScript.text = oldScript.text || oldScript.textContent || "";
      oldScript.parentNode.replaceChild(nextScript, oldScript);
    });
  }

  function sendImpression(context, requestId, bidId, ratio) {
    var payload = Object.assign({}, context, {
      zone_id: zoneId,
      request_id: requestId || "",
      bid_id: bidId || "",
      visible_ratio: ratio || 0
    });
    var body = JSON.stringify(payload);
    var url = baseUrl + "/v1/events/impression";

    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body,
      credentials: "omit",
      keepalive: true
    }).then(function(response) {
      log("impression event", response.status, requestId);
    }).catch(function(error) {
      log("impression error", error);
      if (navigator.sendBeacon) {
        navigator.sendBeacon(url, new Blob([body], { type: "application/json" }));
      }
    });
  }

  function sendClick(context, requestId, bidId, targetUrl) {
    var payload = Object.assign({}, context, {
      zone_id: zoneId,
      request_id: requestId || "",
      bid_id: bidId || "",
      target_url: targetUrl || ""
    });
    var body = JSON.stringify(payload);
    var url = baseUrl + "/v1/events/click";

    if (navigator.sendBeacon) {
      var sent = navigator.sendBeacon(url, new Blob([body], { type: "application/json" }));
      if (sent) {
        log("click event", requestId, targetUrl);
        return;
      }
    }

    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body,
      credentials: "omit",
      keepalive: true
    }).then(function(response) {
      log("click event", response.status, requestId);
    }).catch(function(error) {
      log("click error", error);
    });
  }

  function observeClicks(container, context, requestId, bidId) {
    container.addEventListener("click", function(event) {
      var target = event.target;
      var link = target && target.closest ? target.closest("a") : null;
      sendClick(context, requestId, bidId, link ? link.href : "");
    }, true);
  }

  function observeImpression(container, context, requestId, bidId) {
    if (!("IntersectionObserver" in window)) {
      sendImpression(context, requestId, bidId, 1);
      return;
    }

    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
          sendImpression(context, requestId, bidId, entry.intersectionRatio);
          observer.disconnect();
        }
      });
    }, { threshold: [0.5] });

    observer.observe(container);
  }

  async function loadAd() {
    var container = document.getElementById(containerId);
    if (!container) {
      return;
    }

    var clientId = getClientId();
    var context = buildContext(clientId);
    log("request", zoneId, context);

    try {
      var response = await fetch(baseUrl + "/v1/serve/" + zoneId, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(context),
        credentials: "omit"
      });

      var html = await response.text();
      if (!response.ok || !html) {
        log("empty response", response.status);
        return;
      }

      log("fill", response.status, response.headers.get("X-Bidvol-Request-Id"));
      renderAd(container, html);
      observeClicks(
        container,
        context,
        response.headers.get("X-Bidvol-Request-Id"),
        response.headers.get("X-Bidvol-Bid-Id")
      );
      observeImpression(
        container,
        context,
        response.headers.get("X-Bidvol-Request-Id"),
        response.headers.get("X-Bidvol-Bid-Id")
      );
    } catch (error) {
      console.error("Bidvol tag error:", error);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", loadAd);
  } else {
    loadAd();
  }
})();
</script>
<!-- End Bidvol SSP Ad Tag -->
  </body>
</html>
